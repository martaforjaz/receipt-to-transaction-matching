<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt-to-Transaction Matching</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f7;color:#142d47;font:16px system-ui}main{max-width:1040px;margin:auto;padding:30px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#142d47;color:white;border-radius:16px;padding:24px 30px}h1{font-size:clamp(1.5rem,4vw,2.25rem);margin:0}header p{margin:.55rem 0 0;color:#e1edf7}.controls{margin:20px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}select,button{font:inherit;padding:.55rem;border:1px solid #8196a8;border-radius:7px;background:white;color:#142d47}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}article{min-width:0;background:white;border:1px solid #d7e1eb;border-radius:12px;padding:16px}h2{font-size:1.05rem;margin:0 0 12px}img{width:100%;display:block;border:1px solid #d8dfdf}dl{display:grid;grid-template-columns:auto 1fr;gap:7px;margin:.7rem 0}dd{margin:0;overflow-wrap:anywhere}dt{color:#526576}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f6;padding:8px;font-size:.8rem}output{color:#145b55;font-weight:700}@media(max-width:740px){.grid{grid-template-columns:1fr}img{max-width:360px}}
</style>
<main>
<header><div><h1>Receipt-to-Transaction Matching</h1><p>Compare extracted receipt fields and inspect the ledger evidence behind a match.</p></div>
<svg width="74" height="68" viewBox="0 0 74 68" aria-hidden="true"><path d="M10 8h34v50l-6-4-6 4-6-4-6 4-5-4-5 4z" fill="#dfede8"/><path d="M16 20h22m-22 8h18m-18 8h12" stroke="#142d47" stroke-width="2"/><circle cx="49" cy="45" r="13" fill="#58a9a0" stroke="#142d47" stroke-width="2"/><path d="m42 45 5 5 8-9" fill="none" stroke="#142d47" stroke-width="2.5"/></svg>
</header>
<div class="controls"><label for="receipt">Synthetic receipt</label><select id="receipt"></select><button id="check" type="button">Compare</button><small id="error" role="status"></small></div>
<div class="grid">
<article><h2>Receipt</h2><img id="image" alt="Selected synthetic receipt"></article>
<article><h2>Live OCR</h2><div id="ocr" aria-live="polite"></div></article>
<article><h2>Vision model · recorded run</h2><div id="vision" aria-live="polite"></div></article>
</div>
</main>
<script>
const elem = id => document.getElementById(id);
async function get(path) {
  const response = await fetch(path);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error);
  return data;
}
function display(target, data) {
  target.replaceChildren();
  const outcome = document.createElement('output');
  outcome.textContent = data.result.status.replaceAll('_', ' ') + (data.result.transaction ? ' · ' + data.result.transaction : '');
  target.append(outcome);
  const fields = document.createElement('dl');
  for (const [label, value] of [['Merchant',data.parsed.merchant],['Date',data.parsed.date],['Total',data.parsed.cents == null ? null : '€' + (data.parsed.cents/100).toFixed(2)]]) {
    const name = document.createElement('dt');
    const entry = document.createElement('dd');
    name.textContent = label;
    entry.textContent = value ?? 'Unknown';
    fields.append(name,entry);
  }
  target.append(fields);
  const detail = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = 'Candidates and extraction';
  const evidence = document.createElement('pre');
  evidence.textContent = JSON.stringify(data.result.candidates, null, 2) + '\n\n' + data.raw;
  detail.append(summary,evidence);
  target.append(detail);
}
async function compare() {
  const id = elem('receipt').value;
  elem('check').disabled = elem('receipt').disabled = true;
  elem('image').src = '/receipt/' + id;
  await Promise.all([['ocr','match'],['vision','vision']].map(async ([target,path]) => {
    elem(target).textContent = 'Loading…';
    try { display(elem(target), await get('/' + path + '/' + id)); }
    catch (error) { elem(target).textContent = error.message; }
  }));
  elem('check').disabled = elem('receipt').disabled = false;
}
get('/cases').then(async cases => {
  for (const [id,group] of Object.entries(cases)) {
    elem('receipt').add(new Option(id.toUpperCase() + ' · ' + group.replaceAll('_',' '), id));
  }
  await compare();
}).catch(error => {elem('error').textContent = error.message;});
elem('check').onclick = compare;
</script>
</html>
